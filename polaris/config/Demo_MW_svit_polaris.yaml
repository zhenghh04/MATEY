basic_config: &basic_config
  # Run settings
  log_to_screen: !!bool True
  save_checkpoint: !!bool True
  checkpoint_save_interval: 10
  true_time: !!bool False
  num_data_workers: 2
  enable_amp: !!bool False
  compile: !!bool False
  gradient_checkpointing: !!bool False
  exp_dir: 'Demo_MW'
  log_interval: 1
  pretrained: !!bool False
  # Training settings
  drop_path: 0.1
  batch_size: 4
  max_epochs: 5
  scheduler_epochs: -1
  epoch_size: 10
  rescale_gradients: !!bool False
  optimizer: 'AdamW'
  scheduler: 'cosine'
  warmup_steps: 10
  learning_rate: 1e-3
  weight_decay: 1e-3
  n_states: 15
  state_names: ['Pressure', 'Vx', 'Vy', 'Density',  'Vx', 'Vy', 'Density', 'Pressure']
  dt: 1
  leadtime_max: 1
  n_steps: 2
  enforce_max_steps: !!bool False
  accum_grad: 2
  # Model settings
  model_type: 'svit'
  time_type: 'all2all_time'
  space_type: 'all2all'
  tie_fields: !!bool False
  embed_dim: 192
  num_heads: 3
  processor_blocks: 12
  tokenizer_heads:
    - head_name: "tk-2D"
      patch_size: [[1, 16, 16]]
  adaptive: !!bool False
  sts_model: !!bool False
  adap_samp: !!bool False
  nrefines: 0
  bias_type: 'none'
  # Data settings
  train_val_test: [.8, .1, .1]
  augmentation: !!bool False
  use_all_fields: !!bool True
  tie_batches: !!bool False
  extended_names: !!bool False
  embedding_offset: 0
  train_data_paths: [
              ['/eagle/datascience/hzheng/matey/data/train', 'thermalcollision2d', '', 'tk-2D'],
              ]
  valid_data_paths: [
              ['/eagle/datascience/hzheng/matey/data/valid', 'thermalcollision2d', '', 'tk-2D'],
              ]
  append_datasets: []
